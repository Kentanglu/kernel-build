name: Asyanx Build

on: [push]

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:jammy-20231004

    steps:
      - uses: actions/checkout@v4

      - name: Setup CI
        run: |
          set -e

          cp -af sources.list /etc/apt/
          cp -af 99own /etc/apt/apt.conf.d/

          apt-get update
          apt-get install -y \
            cpio gcc g++ g++-multilib \
            llvm lld clang \
            python3 python3-pip python3-dev \
            git git-lfs default-jre \
            automake lzop bison gperf build-essential \
            zip curl wget ca-certificates \
            zlib1g-dev libbz2-dev libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng bc libstdc++6 \
            libncurses5 libxml2 libxml2-utils \
            libssl-dev rsync flex libz3-dev libz3-4 \
            axel tar binutils-dev cmake file libelf-dev \
            ninja-build texinfo u-boot-tools xz-utils

          dpkg --configure -a
          apt-get install -f -y

          ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          date

          python3 -m pip install --user networkx

      - name: Build Kernel
        run: bash kernel.sh
